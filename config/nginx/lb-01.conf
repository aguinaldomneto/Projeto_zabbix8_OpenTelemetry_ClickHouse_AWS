# Balanceador do laboratório (host simulado "host-local-09"): pedidos e
# pagamentos. "proxy_pass" sem caminho mantém a URL original, já que a
# api_ficticia.py trata qualquer caminho da mesma forma.
server {
    listen 80;

    location /comprar {
        proxy_pass http://pedidos:8080;
    }

    location /confirmar {
        proxy_pass http://pedidos:8080;
    }

    location /status {
        proxy_pass http://pagamentos:8080;
    }

    # Item de agente HTTP do Zabbix lê esta rota para monitorar o próprio LB.
    location /stub_status {
        stub_status;
    }
}
