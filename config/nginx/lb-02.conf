# Balanceador do laboratório (host simulado "host-local-10"): catalogo,
# streaming e autenticacao.
server {
    listen 80;

    location /listar {
        proxy_pass http://catalogo:8080;
    }

    location /assistir {
        proxy_pass http://streaming:8080;
    }

    location /login {
        proxy_pass http://autenticacao:8080;
    }

    location /stub_status {
        stub_status;
    }
}
