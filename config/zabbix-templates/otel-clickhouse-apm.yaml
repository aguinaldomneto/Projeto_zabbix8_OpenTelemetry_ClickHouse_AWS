      tags:
        - tag: class
          value: application
        - tag: target
          value: opentelemetry
      macros:
        - macro: '{$OTEL.ERROR.PCT.HIGH}'
          value: '30'
          description: 'Taxa de erro de spans (%) que abre problema High.'
        - macro: '{$OTEL.ERROR.PCT.RECOVERY}'
          value: '10'
          description: 'Taxa de erro (%) abaixo da qual o problema fecha (histerese).'
        - macro: '{$OTEL.ERROR.PCT.WARN}'
          value: '15'
          description: 'Taxa de erro de spans (%) que abre problema (Average). Aceita contexto por serviço: {$OTEL.ERROR.PCT.WARN:"svc"}.'
        - macro: '{$OTEL.INGEST.MAX_AGE}'
          value: 5m
          description: 'Idade máxima do último span/log/métrica antes de considerar a ingestão parada.'
        - macro: '{$OTEL.LATENCY.P95.RECOVERY}'
          value: '2'
          description: 'Latência p95 (s) abaixo da qual o problema fecha.'
        - macro: '{$OTEL.LATENCY.P95.WARN}'
          value: '3'
          description: 'Latência p95 (s) de spans Server que abre problema. Aceita contexto por serviço.'
        - macro: '{$OTEL.LLD.INTERVAL}'
          value: 5m
          description: 'Intervalo da descoberta de serviços (SELECT DISTINCT ServiceName equivalente).'
        - macro: '{$OTEL.LLD.SERVICE.MATCHES}'
          value: '.*'
          description: 'Regex de serviços a descobrir.'
        - macro: '{$OTEL.LLD.SERVICE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex de serviços a ignorar.'
        - macro: '{$OTEL.LOGS.ERROR.MAX}'
          value: '60'
          description: 'Logs ERROR/FATAL em 5 minutos que abrem problema.'
        - macro: '{$OTEL.LOGS.ERROR.RECOVERY}'
          value: '40'
          description: 'Logs ERROR/FATAL em 5 minutos abaixo dos quais o problema fecha.'
        - macro: '{$OTEL.LOOKBACK}'
          value: 10m
          description: 'Limite de retrocesso quando a última coleta falhou ou é antiga.'
        - macro: '{$OTEL.NODATA.WINDOW}'
          value: 10m
          description: 'Janela do nodata() dos itens de timestamp.'
        - macro: '{$OTEL.TIME_SHIFT}'
          value: 30s
          description: 'Atraso da janela de processamento (dá tempo ao proxy de gravar no ClickHouse).'
