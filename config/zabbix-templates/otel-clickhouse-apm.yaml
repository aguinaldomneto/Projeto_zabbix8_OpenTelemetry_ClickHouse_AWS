              value_type: FLOAT
              units: s
              description: 'Percentil 50 de Duration dos spans Server do serviço (ns -> s).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var c = JSON.parse(value).columns;
                      c.erros = (c.StatusCode === 'Error') ? c.spans : 0;
                      return JSON.stringify([c]);
                - type: JSONPATH
                  parameters:
