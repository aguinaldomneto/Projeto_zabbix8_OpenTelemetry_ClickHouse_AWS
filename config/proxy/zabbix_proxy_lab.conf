# Configuração do proxy para o laboratório.
#
# Carrega toda a configuração padrão da imagem (que lê as variáveis ZBX_*) e
# acrescenta o coletor OpenTelemetry, que a imagem ainda não expõe por variável.

Include=/etc/zabbix/zabbix_proxy.conf

### Coletor OpenTelemetry (APM) embutido no proxy
# Recebe OTLP por gRPC e grava no ClickHouse definido em TelemetryProvider.
# A coleta só começa depois de habilitada no cadastro do proxy
# (Administration > Proxies, ou "make bootstrap").
StartAPMCollectors=1
APMListenIP=0.0.0.0
APMListenPort=4317
